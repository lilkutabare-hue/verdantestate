<section class="ve ve-sec ve-bld" id="ve-builder">
  <div class="ve-wrap ve-sec__top ve-line">
    <p class="ve-caps ve-r">Почему цена индивидуальная</p>
    <h2 class="ve-h2 ve-r ve-bld__h">Соберите свой сад</h2>
    <p class="ve-sub ve-r">Отметьте, что есть на участке, — покажем ориентир по уровню.</p>
    <div class="ve-bld__box ve-panel ve-r">
      <div class="ve-bld__area">
        <label class="ve-bld__lab" for="ve-bld-area">Площадь участка</label>
        <output class="ve-bld__val" for="ve-bld-area"><b>12</b> соток</output>
        <input class="ve-bld__range" id="ve-bld-area" type="range" min="4" max="60" step="1" value="12" aria-label="Площадь участка, соток">
        <div class="ve-bld__scale ve-num"><span>4</span><span>60</span></div>
      </div>
      <div class="ve-bld__chips" role="group" aria-label="Что есть на участке">
        <button type="button" class="ve-chip ve-bld__chip" data-f="газон">Газон</button>
        <button type="button" class="ve-chip ve-bld__chip" data-f="деревья">Деревья</button>
        <button type="button" class="ve-chip ve-bld__chip" data-f="кустарники">Кустарники</button>
        <button type="button" class="ve-chip ve-bld__chip" data-f="цветники">Цветники</button>
        <button type="button" class="ve-chip ve-bld__chip" data-f="живые изгороди">Живые изгороди</button>
        <button type="button" class="ve-chip ve-bld__chip" data-f="автополив">Автополив</button>
        <button type="button" class="ve-chip ve-bld__chip" data-f="рельеф">Сложный рельеф</button>
        <button type="button" class="ve-chip ve-bld__chip" data-f="запущенный сад">Запущенный сад</button>
      </div>
      <div class="ve-bld__out">
        <p class="ve-bld__res"><span class="ve-bld__tier">Похоже на <b class="ve-caps">Premium</b></span><span class="ve-bld__dot">·</span><span class="ve-price ve-bld__price">от 110&#8239;000&nbsp;₽ / месяц</span><span class="ve-bld__dot">·</span><span class="ve-muted">точную цифру скажем после осмотра</span></p>
        <button class="ve-btn ve-bld__go" type="button">Рассчитать по моему саду</button>
      </div>
    </div>
  </div>
</section>
<style>
.ve-bld__h{margin-top:14px}
.ve-bld__box{margin-top:36px;padding:26px 20px}
.ve-bld__area{display:grid;grid-template-columns:1fr auto;align-items:end;column-gap:16px}
.ve-bld__lab{font-size:14px;color:var(--ve-moss)}
.ve-bld__val{font-weight:600;letter-spacing:-.015em;font-size:26px;line-height:1;white-space:nowrap;font-variant-numeric:lining-nums proportional-nums}
.ve-bld__val b{font-weight:500;font-size:34px}
.ve-bld__range{grid-column:1/-1;width:100%;margin:18px 0 0;-webkit-appearance:none;appearance:none;height:32px;background:transparent;cursor:pointer}
.ve-bld__range::-webkit-slider-runnable-track{height:4px;background:linear-gradient(to right,var(--ve-ink) var(--p,14%),rgba(31,77,46,.14) var(--p,14%));border-radius:4px;box-shadow:inset 0 1px 1px rgba(21,52,32,.1)}
.ve-bld__range::-moz-range-track{height:2px;background:rgba(31,77,46,.25);border-radius:2px}
.ve-bld__range::-moz-range-progress{height:2px;background:var(--ve-ink);border-radius:2px}
.ve-bld__range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;border-radius:50%;background:linear-gradient(180deg,#fff,rgba(243,246,242,.9));margin-top:-12px;border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(21,52,32,.22),0 0 0 1px rgba(31,77,46,.12),inset 0 1px 0 #fff}
.ve-bld__range::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid rgba(31,77,46,.15);box-shadow:0 4px 14px rgba(21,52,32,.22)}
.ve-bld__scale{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--ve-moss);margin-top:2px}
.ve-bld__chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.ve-bld__price{display:inline-block;min-width:11ch}
.ve-bld__out{margin-top:28px;padding-top:22px;border-top:1px solid var(--ve-line);display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.ve-bld__res{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-size:16px;line-height:1.4}
.ve-bld__tier b{font-size:13px;color:var(--ve-ink);margin-left:4px}
.ve-bld__dot{color:var(--ve-moss)}
@media(max-width:599px){.ve-bld__res{flex-direction:column;gap:4px}.ve-bld__dot{display:none}} /* на телефоне строки итога стоят столбиком, без висячих точек на концах строк */
.ve-bld__note{margin-top:22px;max-width:56ch;color:var(--ve-moss)}
@media(min-width:900px){
  .ve-bld__box{margin-top:56px;padding:40px;display:grid;grid-template-columns:1fr 1fr;column-gap:56px}
  .ve-bld__chips{margin-top:0;align-content:start}
  .ve-bld__out{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;margin-top:34px;padding-top:28px}
  .ve-bld__res{font-size:17px}
}
</style>
<script>
(function(){
  var root=document.getElementById('ve-builder');if(!root||!window.VE)return;
  VE.reveal(root);
  var range=root.querySelector('#ve-bld-area'),val=root.querySelector('.ve-bld__val b'),chips=root.querySelectorAll('.ve-bld__chip'),
      tier=root.querySelector('.ve-bld__tier b'),price=root.querySelector('.ve-bld__price'),go=root.querySelector('.ve-bld__go');
  var PRICE={BASIC:60000,PREMIUM:110000,ESTATE:190000},NAME={BASIC:'Basic',PREMIUM:'Premium',ESTATE:'Estate'};
  function factors(){var a=[];for(var i=0;i<chips.length;i++)if(chips[i].classList.contains('is-on'))a.push(chips[i].getAttribute('data-f'));return a}
  function estimate(area,n){if(area<=10&&n<=2)return 'BASIC';if(area<=25&&n<=5)return 'PREMIUM';return 'ESTATE'}
  var shown=0;
  function update(save){
    var area=+range.value,f=factors(),t=estimate(area,f.length);
    val.textContent=area;range.style.setProperty('--p',((area-4)/56*100).toFixed(1)+'%');
    if(tier.textContent!==NAME[t])VE.swap(tier,NAME[t]);
    if(shown!==PRICE[t]){var from=shown||PRICE[t]*.7;shown=PRICE[t];VE.tween(from,PRICE[t],450,function(v){price.innerHTML='от '+VE.fmt(Math.round(v/1000)*1000)+'&nbsp;₽ / месяц'})}
    if(save){VE.set('area',area);VE.set('factors',f);VE.set('estimate',t)}
  }
  if(VE.state.area){range.value=VE.state.area}
  if(VE.state.factors)for(var i=0;i<chips.length;i++)if(VE.state.factors.indexOf(chips[i].getAttribute('data-f'))>=0)chips[i].classList.add('is-on');
  range.addEventListener('input',function(){update(false)});
  range.addEventListener('change',function(){update(true)});
  for(var j=0;j<chips.length;j++)chips[j].addEventListener('click',function(){this.classList.toggle('is-on');update(true)});
  go.addEventListener('click',function(){update(true);VE.goForm({tariff:VE.state.estimate})});
  update(false);
})();
</script>
