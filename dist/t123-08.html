<style>
.ve-ba__h{margin-top:14px;max-width:22ch}
.ve-ba__box{position:relative;margin-top:36px;aspect-ratio:16/10;border-radius:var(--ve-r);overflow:hidden;background:var(--ve-paper-2)}
.ve-ba__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* шторка сдвигом слоёв, а не clip-path (clip-path в WebKit перерисовывал картинку 1440 px каждый кадр — 7–12 рывков/с на iPhone):
   обёртка «после» уезжает вправо на x, картинка внутри — обратно на x; JS пишет transform напрямую */
.ve-ba__after{position:absolute;inset:0;overflow:hidden;transform:translate3d(50%,0,0);will-change:transform}
.ve-ba__after .ve-ba__img--after{transform:translate3d(-50%,0,0);will-change:transform}
.ve-ba__lab{position:absolute;top:12px;font-family:var(--ve-serif);font-style:italic;font-weight:500;font-size:18px;letter-spacing:.01em;color:var(--ve-paper);opacity:.95;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.ve-ba__lab--b{left:16px}.ve-ba__lab--a{right:16px}
.ve-ba__bar{position:absolute;top:0;bottom:0;left:0;width:100%;pointer-events:none;transform:translate3d(50%,0,0);will-change:transform} /* линия и ручка у левого края полосы, полоса едет transform'ом */
.ve-ba__bar::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:var(--ve-paper);opacity:.9}
.ve-ba__bar i{position:absolute;top:50%;left:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;isolation:isolate;--ve-bloom-on:.6;--ve-ring-w:1.2px;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.65);-webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%);box-shadow:0 6px 20px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(0,0,0,.1)}
.ve-ba__bar i b{position:absolute;inset:0;pointer-events:none}
.ve-ba__bar i b::before,.ve-ba__bar i b::after{content:"";position:absolute;top:50%;width:7px;height:7px;border-top:1.5px solid #fff;border-left:1.5px solid #fff;margin-top:-4px}
.ve-ba__bar i b::before{left:13px;transform:rotate(-45deg)}.ve-ba__bar i b::after{right:13px;transform:rotate(135deg)}
@media(prefers-reduced-transparency:reduce){.ve-ba__bar i{background:rgba(255,255,255,.95);-webkit-backdrop-filter:none;backdrop-filter:none}.ve-ba__bar i b::before,.ve-ba__bar i b::after{border-color:var(--ve-ink)}}
.ve-ba__range{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;-webkit-appearance:none;appearance:none;touch-action:pan-y}
.ve-ba__range::-webkit-slider-thumb{-webkit-appearance:none;width:60px;height:100%}
.ve-ba__range::-moz-range-thumb{width:60px;height:100%;border:0;background:transparent}
.ve-ba__box:has(.ve-ba__range:focus-visible) .ve-ba__bar i{outline:2px solid var(--ve-paper);outline-offset:3px} /* ползунок прозрачный — фокус с клавиатуры показываем на ручке */
@media(min-width:900px){.ve-ba__box{margin-top:56px}.ve-ba__lab{top:20px}.ve-ba__lab--b{left:24px}.ve-ba__lab--a{right:24px}}
</style>
<script>
(function(){
  var root=document.getElementById('ve-before-after');if(!root||!window.VE)return;
  VE.reveal(root);
  var box=root.querySelector('.ve-ba__box'),r=root.querySelector('.ve-ba__range'),touched=false;
  var aw=root.querySelector('.ve-ba__after'),bar=root.querySelector('.ve-ba__bar');
  function setX(x){var v=(+x).toFixed(2);aw.style.transform='translate3d('+v+'%,0,0)';bar.style.transform='translate3d('+v+'%,0,0)';var inner=aw.querySelectorAll('.ve-ba__img--after');for(var i=0;i<inner.length;i++)inner[i].style.transform='translate3d(-'+v+'%,0,0)'}
  /* ручка — под пальцем и курсором: у ползунка шириной 60 px центр бегунка ходит от 30 px до ширины − 30 px, и ручка по значению уезжала от пальца до 29 px к краям.
     Пока тянут, положение считаем по самому указателю; значение ползунку возвращаем после — клавиши продолжают с того же места */
  var px=null,dragged=false;
  var atPx=function(x){var b=box.getBoundingClientRect();return Math.max(0,Math.min(100,(x-b.left)/(b.width||1)*100))};
  r.addEventListener('input',function(){touched=true;dragged=px!==null;setX(px!==null?atPx(px):r.value)});
  var move=function(e){if(px===null)return;if(e.pointerType==='mouse'&&!(e.buttons&1))return up();px=e.clientX;if(dragged)setX(atPx(px))},
      up=function(){if(px!==null&&dragged)r.value=atPx(px);px=null;dragged=false;window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up)};
  r.addEventListener('pointerdown',function(e){touched=true;px=e.clientX;dragged=false;window.addEventListener('pointermove',move,{passive:true});window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up)});
  // клавиатура: шаг ползунка 0.1 (для плавности пальца) давал стрелке 0.1 % — 6 px за пять нажатий; стрелки — 2 %, с Shift и PageUp/PageDown — 10 %, Home/End — края
  r.addEventListener('keydown',function(e){var k=e.key,v=+r.value,s=e.shiftKey?10:2,n=k==='ArrowRight'||k==='ArrowUp'?v+s:k==='ArrowLeft'||k==='ArrowDown'?v-s:k==='PageUp'?v+10:k==='PageDown'?v-10:k==='Home'?0:k==='End'?100:null;
    if(n===null)return;e.preventDefault();touched=true;n=Math.max(0,Math.min(100,n));r.value=n;setX(n)});
  // подсказка: при появлении шторка сама проезжает к «после», к «до» и возвращается; прерывается первым касанием
  function demo(){
    if(VE.rm||touched)return;
    var K=[[0,50],[.38,24],[.72,70],[1,50]],t0=performance.now(),D=2600;
    (function f(now){if(touched)return;var t=Math.min(1,(now-t0)/D),i=1;while(K[i][0]<t)i++;var a=K[i-1],b=K[i],k=(t-a[0])/(b[0]-a[0]),e=.5-.5*Math.cos(Math.PI*k),x=a[1]+(b[1]-a[1])*e;
      setX(x);r.value=x;if(t<1)requestAnimationFrame(f)})(t0);
  }
  if('IntersectionObserver' in window){var io=new IntersectionObserver(function(en){if(en[0].isIntersecting){io.disconnect();setTimeout(demo,500)}},{threshold:.5});io.observe(box)}
})();
</script>
