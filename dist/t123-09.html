<section class="ve ve-sec ve-ways" id="ve-ways">
  <div class="ve-wrap ve-sec__top ve-line">
    <p class="ve-caps ve-r">Сад под ключ</p>
    <h2 class="ve-h2 ve-r ve-ways__h">Десять способов сделать участок красивее, удобнее и дороже</h2>
  </div>
  <div class="ve-wrap ve-ways__wrap">
    <div class="ve-strip ve-ways__strip ve-rg"></div>
  </div>
</section>
<style>
.ve-ways__h{margin-top:14px;max-width:24ch}
.ve-ways__wrap{margin-top:36px}
.ve-ways__strip{cursor:grab;gap:14px}
.ve-ways__strip.is-drag{cursor:grabbing;scroll-snap-type:none}
.ve-ways__card{width:72vw;max-width:300px;user-select:none;-webkit-user-select:none}
.ve-ways__img{aspect-ratio:4/5;border-radius:var(--ve-r);overflow:hidden;background:var(--ve-paper-2)}
.ve-ways__img img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.ve-ways__n{margin:16px 0 0}.ve-ways__n b{color:var(--ve-moss)}.ve-ways__n span{color:var(--ve-ink)}
.ve-ways__d{margin-top:8px;font-size:14px;color:var(--ve-moss);line-height:1.45}
/* компьютер: сетка 3 колонки (MOX), карточка = фото 4:5 + подпись; лента остаётся на телефоне */
@media(min-width:900px){
  .ve-ways__wrap{margin-top:56px}
  .ve-ways__strip{display:grid;grid-template-columns:repeat(3,1fr);gap:48px 40px;overflow:visible;scroll-snap-type:none;margin:0;padding:0;cursor:auto}
  .ve-ways__card{width:auto;max-width:none}
}
</style>
<script>
(function(){
  var root=document.getElementById('ve-ways');if(!root||!window.VE)return;
  var WAYS=[
    ['Обновление газона','подсев, выравнивание, аэрация, удобрение'],
    ['Декоративные дорожки','галька, отсев, плитняк, спилы дерева'],
    ['Декоративные клумбы','многолетники, кустарники, мульча, камень'],
    ['Подсветка','светильники, подсветка деревьев, кустов и дорожек'],
    ['Живая изгородь','туи, можжевельники, дерен, пузыреплодник'],
    ['Каменные композиции','рокарии, валуны, щебень, хвойные'],
    ['Автополив','автоматическая система полива'],
    ['Зона отдыха','костровые зоны, настилы, перголы, качели, гамаки'],
    ['Сезонное обслуживание','стрижка, обрезка, обработка, прополка, удобрение, подготовка к зиме'],
    ['Премиальное обновление','комплексное преображение: дизайн, растения, дорожки, подсветка, детали']
  ];
  var strip=root.querySelector('.ve-ways__strip');
  strip.innerHTML=WAYS.map(function(w,i){var n=('0'+(i+1)).slice(-2);var lp=({'02':'r02','04':'r04','07':'r07'})[n];return '<article class="ve-ways__card"><div class="ve-ways__img ve-px"'+(lp?' data-loop="'+lp+'" data-loop-mode="hover"':'')+'><img src="'+VE.base+'media/stills/way-'+n+'-l.webp?v='+VE.v+'" srcset="'+VE.base+'media/stills/way-'+n+'-s.webp?v='+VE.v+' 560w, '+VE.base+'media/stills/way-'+n+'-l.webp?v='+VE.v+' 1000w" sizes="(min-width:900px) 272px, 72vw" alt="" loading="lazy" decoding="async" width="1000" height="1250"></div><h3 class="ve-cap ve-ways__n"><b class="ve-num">'+n+'</b><i></i><span>'+w[0]+'</span></h3><p class="ve-ways__d">'+w[1]+'</p></article>'}).join('');
  VE.reveal(root);VE.emit('px:refresh');
  // на телефоне с мышью (узкое окно) — тянуть мышью, без перехвата колеса; на компьютере лента стала сеткой
  if(window.matchMedia('(pointer:fine) and (max-width:899px)').matches){
    var down=false,sx=0,sl=0,moved=false;
    strip.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse')return;down=true;moved=false;sx=e.clientX;sl=strip.scrollLeft;strip.setPointerCapture(e.pointerId)});
    strip.addEventListener('pointermove',function(e){if(!down)return;var dx=e.clientX-sx;if(Math.abs(dx)>4&&!moved){moved=true;strip.classList.add('is-drag')}if(moved)strip.scrollLeft=sl-dx});
    var up=function(e){if(!down)return;down=false;strip.classList.remove('is-drag')};
    strip.addEventListener('pointerup',up);strip.addEventListener('pointercancel',up);
  }
})();
</script>
