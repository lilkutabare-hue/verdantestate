<!-- cookie-строка: одна линия внизу, появляется после хиро, пока не нажали «Хорошо» (нужна при публикации на домене) -->
<div class="ve ve-ck ve-dock--light" id="ve-cookie" role="region" aria-label="Cookie" hidden>
  <div class="ve-ck__in"><p>Сайт использует cookie — так он работает лучше. <a href="/policy" data-ve-policy>Подробнее</a></p><button class="ve-btn ve-btn--sm ve-btn--ghost" type="button" data-ve-ck-ok>Хорошо</button></div>
</div>
<style>
.ve-ck{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;border-radius:20px;transform:translateY(calc(100% + 24px));transition:transform .55s var(--ve-ease)}
.ve-ck.is-on{transform:none}
html.ve-coarse .ve-ck{background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.9));-webkit-backdrop-filter:none;backdrop-filter:none}
@media(min-width:900px){.ve-ck{left:auto;right:24px;bottom:24px;max-width:600px}}
.ve-ck__in{padding:12px 14px 12px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.ve-ck__in p{font-size:13px;line-height:1.4;color:var(--ve-moss)}
.ve-ck__in p a{color:var(--ve-ink);border-bottom:1px solid var(--ve-line)}
.ve-ck .ve-btn--sm{flex:0 0 auto;min-height:38px;height:38px;padding:0 16px}
@media(max-width:599px){.ve-ck .ve-btn--sm{min-height:38px;padding:0 16px;font-size:14px}}
@media(prefers-reduced-motion:reduce){.ve-ck{transition:none}}
</style>
<script>
(function(){
  var ck=document.getElementById('ve-cookie');if(!ck)return;var KEY='ve-cookie-ok',ok=false;
  try{ok=localStorage.getItem(KEY)==='1'}catch(e){}
  if(ok)return;ck.hidden=false;
  // показываем после хиро, чтобы первый экран был чистым
  var shown=false;function tick(){if(shown)return;var h=document.getElementById('ve-hero');if(h&&h.getBoundingClientRect().bottom>window.innerHeight*.4)return;/* не раньше, чем хиро ушёл больше чем наполовину — иначе плашка ложится на кнопку */shown=true;ck.classList.add('is-on');window.removeEventListener('scroll',tick)}
  window.addEventListener('scroll',tick,{passive:true});tick();
  ck.querySelector('[data-ve-ck-ok]').addEventListener('click',function(){ck.classList.remove('is-on');try{localStorage.setItem(KEY,'1')}catch(e){}setTimeout(function(){ck.hidden=true},500)});
})();
</script>
<style>

</style>
<script>
(function(){
  var root=document.getElementById('ve-footer');if(!root||!window.VE)return;
  var y=root.querySelector('[data-ve-year]');if(y)y.textContent=new Date().getFullYear();
  // логотип: дуга рисуется по часовой от верха, ветвь растёт снизу вверх, буквы и подписи проявляются
  var logo=root.querySelector('.ve-ft__logo'),wedge=root.querySelector('.ve-ft__wedge'),s1=root.querySelector('.ve-ft__s1'),s2=root.querySelector('.ve-ft__s2');
  var CX=638.8,CY=506.2,R=420,A0=-96,A1=142;
  function ring(t){var a1=A0+(A1-A0)*t,n=Math.max(2,Math.ceil(t*60)),d='M'+CX+' '+CY;for(var k=0;k<=n;k++){var a=(A0+(a1-A0)*k/n)*Math.PI/180;d+='L'+(CX+R*Math.cos(a)).toFixed(1)+' '+(CY+R*Math.sin(a)).toFixed(1)}wedge.setAttribute('d',d+'Z')}
  function branch(t){var o=Math.min(1,t*1.08);s1.setAttribute('offset',Math.max(0,o-.08).toFixed(3));s2.setAttribute('offset',o.toFixed(3))}
  function end(){ring(1);branch(1);s2.setAttribute('offset','1.1');logo.classList.add('is-in')}
  ring(0);branch(0);
  function play(){
    if(VE.rm)return end();
    logo.classList.add('is-in');var t0=performance.now();
    (function f(now){var t=(now-t0)/1000,a=Math.min(1,t/1.3),b=Math.min(1,Math.max(0,(t-.45)/1.5));
      ring(1-Math.pow(1-a,3));branch(1-Math.pow(1-b,2));if(a<1||b<1)requestAnimationFrame(f);else end()})(t0);
  }
  if('IntersectionObserver' in window){var io=new IntersectionObserver(function(en){if(en[0].isIntersecting){io.disconnect();play()}},{threshold:.35});io.observe(logo)}else end();
})();
</script>
