<footer class="ve ve-ft" id="ve-footer">
  <div class="ve-wrap">
    <div class="ve-ft__logo">
      <svg viewBox="150 220 954 784" fill="currentColor" role="img" aria-label="Verdant Estate — Landscaping &amp; Garden Design">
        <defs>
          <mask id="ve-ftm-ring" maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="1254"><path class="ve-ft__wedge" fill="#fff" d="M0 0Z"/></mask>
          <linearGradient id="ve-ftg-br" gradientUnits="userSpaceOnUse" x1="0" y1="800" x2="0" y2="210"><stop class="ve-ft__s1" offset="0" stop-color="#fff"/><stop class="ve-ft__s2" offset="0" stop-color="#000"/></linearGradient>
          <mask id="ve-ftm-br" maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="1254"><rect width="1254" height="1254" fill="url(#ve-ftg-br)"/></mask>
        </defs>
        <use href="#ve-l-ring" mask="url(#ve-ftm-ring)"/>
        <use href="#ve-l-branch" mask="url(#ve-ftm-br)"/>
        <use class="ve-ft__p" href="#ve-l-letters" style="--d:900ms"/>
        <use class="ve-ft__p" href="#ve-l-word" style="--d:1150ms"/>
        <use class="ve-ft__p" href="#ve-l-rules" style="--d:1350ms"/>
        <use class="ve-ft__p" href="#ve-l-leaf" style="--d:1450ms"/>
        <use class="ve-ft__p" href="#ve-l-tag" style="--d:1550ms"/>
      </svg>
    </div>
    <div class="ve-ft__cols">
      <p class="ve-ft__geo">Москва и Московская область</p>
      <div class="ve-ft__links">
        <a class="ve-num" href="tel:+70000000000" data-ve-tel>+7 000 000-00-00</a>
        <a href="https://t.me/" target="_blank" rel="noopener" data-ve-tg>Telegram</a>
        <a href="https://wa.me/" target="_blank" rel="noopener" data-ve-wa>WhatsApp</a>
        <a href="mailto:hello@example.com" data-ve-mail>hello@example.com</a>
      </div>
      <p class="ve-ft__legal"><a href="#" data-ve-policy>Политика конфиденциальности</a><span>© <span class="ve-num" data-ve-year>2026</span> Verdant Estate</span></p>
    </div>
  </div>
</footer>
<style>
.ve-ft{padding:var(--ve-gap) 0 calc(40px + env(safe-area-inset-bottom));border-top:1px solid var(--ve-line);background:var(--ve-paper)}
.ve-ft__logo{display:flex;justify-content:center;color:var(--ve-ink)}
.ve-ft__logo svg{display:block;width:260px;height:auto;overflow:visible}
.ve-ft__p{opacity:0;transform:translateY(10px);transition:opacity .7s var(--ve-ease),transform .7s var(--ve-ease);transition-delay:var(--d,0ms)}
.ve-ft__logo.is-in .ve-ft__p{opacity:1;transform:none}
.ve-ft__cols{margin-top:48px;display:grid;gap:20px;text-align:center;font-size:15px}
.ve-ft__geo{color:var(--ve-moss)}
.ve-ft__links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px}
.ve-ft__links a{color:var(--ve-ink);border-bottom:1px solid transparent;transition:border-color .25s}
@media(hover:hover){.ve-ft__links a:hover{border-color:var(--ve-line)}}
.ve-ft__legal{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;font-size:13px;color:var(--ve-moss)}
.ve-ft__legal a{color:inherit}
@media(min-width:900px){
  .ve-ft__logo svg{width:320px}
  .ve-ft__cols{margin-top:64px;grid-template-columns:1fr auto 1fr;align-items:center;text-align:left}
  .ve-ft__legal{justify-content:flex-end}
}
@media(prefers-reduced-motion:reduce){.ve-ft__p{opacity:1;transform:none;transition:none}}
</style>
<script>
(function(){
  var root=document.getElementById('ve-footer');if(!root||!window.VE)return;
  var y=root.querySelector('[data-ve-year]');if(y)y.textContent=new Date().getFullYear();
  // логотип: дуга рисуется по часовой от верха, ветвь растёт снизу вверх, буквы и подписи проявляются
  var logo=root.querySelector('.ve-ft__logo'),wedge=root.querySelector('.ve-ft__wedge'),s1=root.querySelector('.ve-ft__s1'),s2=root.querySelector('.ve-ft__s2');
  var CX=638.8,CY=506.2,R=420,A0=-96,A1=142;
  function ring(t){var a1=A0+(A1-A0)*t,n=Math.max(2,Math.ceil(t*60)),d='M'+CX+' '+CY;for(var k=0;k<=n;k++){var a=(A0+(a1-A0)*k/n)*Math.PI/180;d+='L'+(CX+R*Math.cos(a)).toFixed(1)+' '+(CY+R*Math.sin(a)).toFixed(1)}wedge.setAttribute('d',d+'Z')}
  function branch(t){var o=Math.min(1,t*1.08);s1.setAttribute('offset',Math.max(0,o-.08).toFixed(3));s2.setAttribute('offset',o.toFixed(3))}
  function end(){ring(1);branch(1);s2.setAttribute('offset','1.1');logo.classList.add('is-in')}
  ring(0);branch(0);
  function play(){
    if(VE.rm)return end();
    logo.classList.add('is-in');var t0=performance.now();
    (function f(now){var t=(now-t0)/1000,a=Math.min(1,t/1.3),b=Math.min(1,Math.max(0,(t-.45)/1.5));
      ring(1-Math.pow(1-a,3));branch(1-Math.pow(1-b,2));if(a<1||b<1)requestAnimationFrame(f);else end()})(t0);
  }
  if('IntersectionObserver' in window){var io=new IntersectionObserver(function(en){if(en[0].isIntersecting){io.disconnect();play()}},{threshold:.35});io.observe(logo)}else end();
})();
</script>
