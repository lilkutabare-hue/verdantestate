<header class="ve ve-hd" id="ve-hd">
  __LOGO_SPRITE__
  <div class="ve-hd__in">
    <a class="ve-hd__mark ve-ring" href="#ve-hero" aria-label="Verdant Estate" data-spectral>__MARK__</a>
    <div class="ve-hd__right">
      <a class="ve-hd__tel ve-num" href="tel:+70000000000" data-ve-tel>+7 000 000-00-00</a>
      <button class="ve-btn ve-btn--sm ve-btn--light ve-hd__cta" type="button" data-ve-go-form>Рассчитать</button>
    </div>
  </div>
</header>
<style>
.ve-hd{position:fixed;top:0;left:0;right:0;z-index:60;background:transparent;color:var(--ve-paper);
  transform:translateY(0);transition:transform .32s var(--ve-ease-2),background .3s var(--ve-ease-2),color .3s var(--ve-ease-2),box-shadow .3s;
  padding-top:env(safe-area-inset-top)}
.ve-hd__in{max-width:1240px;margin:0 auto;padding:0 var(--ve-pad);height:60px;display:flex;align-items:center;justify-content:space-between;transition:margin .35s var(--ve-ease),padding .35s var(--ve-ease),border-radius .35s var(--ve-ease)}
@media(min-width:900px){.ve-hd__in{height:72px}}
/* после хиро шапка — плавающий стеклянный док (материал xtcpay.me), а не полоса */
.ve-hd.is-solid .ve-hd__in{width:max-content;max-width:calc(100% - 24px);height:56px;margin:10px auto 0;padding:0 7px 0 7px;gap:14px;border-radius:999px}
@media(min-width:900px){.ve-hd.is-solid .ve-hd__in{height:62px;margin-top:12px;gap:22px;padding:0 8px}}
.ve-hd__mark{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;color:inherit;transition:opacity .25s var(--ve-ease-2),background .3s;
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(14px) saturate(1.6) brightness(1.12);backdrop-filter:blur(14px) saturate(1.6) brightness(1.12);box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);--ve-ring-sat:1.2}
.ve-hd__mark svg{width:66%;height:60%}
@media(min-width:900px){.ve-hd__mark{width:48px;height:48px}}
.ve-hd.is-solid .ve-hd__mark{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(243,246,242,.8));border-color:rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(21,52,32,.16),inset 0 1px 0 #fff;-webkit-backdrop-filter:none;backdrop-filter:none;--ve-ring-sat:1.35}
/* на странице с хиро знак шапки появляется, когда в него «садится» логотип первого экрана */
html.ve-has-hero:not(.ve-logo-docked) .ve-hd__mark{opacity:0}
/* над хиро — как у студий: только знак и телефон; кнопка приходит вместе с белой шапкой после пролёта (html.ve-hero-done ставит хиро) */
html.ve-has-hero:not(.ve-hero-done) .ve-hd__cta{opacity:0;visibility:hidden;transform:translateY(-6px)}
.ve-hd__cta{transition:opacity .4s var(--ve-ease),visibility .4s,transform .4s var(--ve-ease),background .3s var(--ve-ease-2),color .3s var(--ve-ease-2),border-color .3s var(--ve-ease-2)}
/* пока идёт заставка, шапки нет */
.ve-hd{transition:transform .32s var(--ve-ease-2),background .3s var(--ve-ease-2),color .3s var(--ve-ease-2),box-shadow .3s,opacity .5s var(--ve-ease)}
html.ve-intro .ve-hd{opacity:0;pointer-events:none;transition:none} /* прячется сразу, без затухания — иначе кнопка мигает над заставкой */
.ve-hd__mark svg{display:block}
.ve-hd__right{display:flex;align-items:center;gap:22px}
.ve-hd__tel{display:none;font-size:15px;letter-spacing:.01em;opacity:.9;padding:0 4px}
@media(min-width:900px){.ve-hd__tel{display:inline}}
.ve-hd.is-solid{color:var(--ve-ink)}
.ve-hd.is-solid .ve-hd__in{background:linear-gradient(180deg,rgba(255,255,255,.64),rgba(255,255,255,.42));border:1px solid rgba(255,255,255,.8);-webkit-backdrop-filter:blur(var(--ve-dock-blur)) saturate(1.6) brightness(1.04);backdrop-filter:blur(var(--ve-dock-blur)) saturate(1.6) brightness(1.04);box-shadow:0 14px 40px rgba(21,52,32,.16),inset 0 1px 0 #fff,inset 0 -8px 20px rgba(255,255,255,.2)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.ve-hd.is-solid .ve-hd__in{background:rgba(255,255,255,.95)}}
@media(prefers-reduced-transparency:reduce){.ve-hd.is-solid .ve-hd__in{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}.ve-hd__mark{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(255,255,255,.9);color:var(--ve-ink)}}
/* после хиро шапка белая — кнопка становится тёмной (вместе с hover) */
.ve-hd.is-solid .ve-hd__cta,.ve-hd.is-solid .ve-hd__cta:hover{background:var(--ve-tint);color:var(--ve-paper);border-color:rgba(255,255,255,.18);text-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.ve-hd.is-hidden{transform:translateY(-110%)}
@media(prefers-reduced-motion:reduce){.ve-hd{transition:none}}
</style>
<script>
(function(){
  var hd=document.getElementById('ve-hd');if(!hd)return;
  var y0=window.scrollY||0,up=0,solidAt=function(){return Math.max(240,(window.innerHeight||600)*.9)};
  function tick(){
    var y=window.scrollY||0,d=y-y0;
    // над хиро шапка прозрачная и не прячется: в ней знак, в который садится логотип первого экрана
    var hero=document.getElementById('ve-hero'),inHero=hero&&hero.getBoundingClientRect().bottom>60;
    hd.classList.toggle('is-solid',!inHero&&y>solidAt());
    if(inHero){hd.classList.remove('is-hidden');up=0}
    else if(d>0){up=0;if(y>80)hd.classList.add('is-hidden')}
    else if(d<0){up+=-d;if(up>10)hd.classList.remove('is-hidden')}
    y0=y;
  }
  window.addEventListener('scroll',tick,{passive:true});tick();
  hd.querySelector('[data-ve-go-form]').addEventListener('click',function(){if(window.VE)VE.goForm()});
})();
</script>
