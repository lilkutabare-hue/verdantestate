<header class="ve ve-hd" id="ve-hd">
  __LOGO_SPRITE__
  <div class="ve-hd__in">
    <button class="ve-hd__burger" type="button" aria-expanded="false" aria-controls="ve-hd-nav" data-ve-menu><i aria-hidden="true"></i>Меню</button>
    <a class="ve-hd__mark" href="#ve-hero" aria-label="Verdant Estate" data-spectral data-spectral-heavy>__MARK__</a>
    <!-- меню разделов (владелец 11.11: «три страницы… в верхнее наше меню внедрить»). Пока страниц нет, пункты ведут к разделам главной: общий обработчик якорей в HEAD едет к разделу, а с /policy и /consent уводит на главную -->
    <nav class="ve-hd__nav" id="ve-hd-nav" aria-label="Разделы сайта">
      <a href="#ve-tariffs">Уход по договору</a>
      <a href="#ve-pricelist">Разовые работы</a>
      <a href="#ve-ways">Сад под ключ</a>
    </nav>
    <div class="ve-hd__right">
      <!-- телефона в шапке нет (владелец 11.11: «дешевит… оставим только в подвале, в контактах») -->
      <button class="ve-btn ve-btn--sm ve-btn--light ve-hd__cta" type="button" data-ve-go-form>Рассчитать</button>
    </div>
  </div>
</header>
<style>
.ve-hd{position:fixed;top:0;left:0;right:0;z-index:60;background:transparent;color:var(--ve-paper);
  transform:translateY(0);transition:transform .32s var(--ve-ease-2),background .3s var(--ve-ease-2),color .3s var(--ve-ease-2),box-shadow .3s;
  padding-top:env(safe-area-inset-top)}
.ve-hd__in{max-width:1240px;margin:0 auto;padding:0 var(--ve-pad);height:60px;display:flex;align-items:center;justify-content:space-between;transition:opacity .4s var(--ve-ease),transform .4s var(--ve-ease)}
/* смена вида шапки (прозрачная над хиро ↔ стеклянный док) не рывком: текущая гаснет и чуть уходит вверх, новая опускается на место (владелец 11.11: «переход резкий») */
.ve-hd.is-swap .ve-hd__in{opacity:0;transform:translateY(-12px);transition-duration:.16s}
@media(min-width:900px){.ve-hd__in{height:72px}}
/* после хиро шапка — плавающий стеклянный док (материал xtcpay.me), а не полоса */
.ve-hd.is-solid .ve-hd__in{width:max-content;max-width:calc(100% - 24px);height:56px;margin:10px auto 0;padding:0 7px 0 7px;gap:14px;border-radius:999px}
@media(min-width:900px){.ve-hd.is-solid .ve-hd__in{height:62px;margin-top:12px;gap:22px;padding:0 8px}}
/* знак — сам логотип как объёмный предмет (владелец: «без подложки, как собственный 3D-лого в обводке»): тень под ним, спектральная кромка и свечение крутятся */
.ve-hd__mark{position:relative;display:flex;align-items:center;justify-content:center;width:46px;height:42px;color:inherit;transition:opacity .25s var(--ve-ease-2)}
.ve-hd__mark svg{width:42px;height:38px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35)) drop-shadow(0 0 1px rgba(255,255,255,.4))}
.ve-mark__glow{opacity:calc(.55*var(--ve-f,1));filter:blur(9px)}
html.ve-coarse .ve-mark__glow{filter:blur(6px)}
.ve-mark__rim{opacity:.95}
.ve-mark__gloss{opacity:.9}
@media(min-width:900px){.ve-hd__mark{width:52px;height:48px}.ve-hd__mark svg{width:48px;height:44px}}
.ve-hd.is-solid .ve-hd__mark svg{filter:drop-shadow(0 2px 4px rgba(21,52,32,.3)) drop-shadow(0 0 1px rgba(255,255,255,.8))}
.ve-hd.is-solid .ve-mark__glow{opacity:calc(.4*var(--ve-f,1))}
.ve-hd.is-solid .ve-mark__gloss{opacity:.5}
/* на странице с хиро знак шапки появляется, когда в него «садится» логотип первого экрана */
html.ve-has-hero:not(.ve-logo-docked) .ve-hd__mark{opacity:0}
/* над хиро — как у студий: только знак и телефон; кнопка приходит вместе с белой шапкой после пролёта (html.ve-hero-done ставит хиро) */
html.ve-has-hero:not(.ve-hero-done) .ve-hd__cta{opacity:0;visibility:hidden;transform:translateY(-6px)}
.ve-hd__cta{transition:opacity .4s var(--ve-ease),visibility .4s,transform .4s var(--ve-ease),background .3s var(--ve-ease-2),color .3s var(--ve-ease-2),border-color .3s var(--ve-ease-2)}
/* меню: над хиро его нет, как и кнопки (владелец 24.10: на первом экране ни кнопок, ни указателя разделов) — приходит вместе с белым доком */
.ve-hd__nav,.ve-hd__burger{transition:opacity .4s var(--ve-ease),visibility .4s,transform .3s var(--ve-ease)}
/* 11.11 (владелец о пунктах голым текстом поверх пролёта: «мне не очень нравится»): меню живёт только в стеклянном доке; пока шапка прозрачная, пунктов и кнопки «Меню» нет */
.ve-hd:not(.is-solid) .ve-hd__nav,.ve-hd:not(.is-solid) .ve-hd__burger{opacity:0;visibility:hidden;pointer-events:none}
.ve-hd__nav a{white-space:nowrap}
.ve-hd__burger{display:none}
/* компьютер: три ссылки в доке между знаком и телефоном; под курсором и на текущей странице — дымка, как у кнопок на бумаге */
@media(min-width:900px){
  .ve-hd__nav{display:flex;align-items:center;gap:2px}
  /* набор как у подписей секций и девиза на хиро: мелкий капс с разрядкой */
  .ve-hd__nav a{position:relative;padding:13px 14px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
  /* наведение — тонкая линия под словом: выезжает слева, уходит вправо. Ни заливки, ни ободков (владелец 11.11: «заполнение по форме» и «ободки прозрачные» — убрать); текущая страница держит линию */
  .ve-hd__nav a::after{content:"";position:absolute;left:14px;right:calc(14px + .12em);bottom:8px;height:1px;background:currentColor;opacity:.6;transform:scaleX(0);transform-origin:right;transition:transform .45s var(--ve-ease)}
  .ve-hd__nav a[aria-current]::after{transform:scaleX(1)}
}
@media(min-width:900px) and (hover:hover){.ve-hd__nav a:hover::after{transform:scaleX(1);transform-origin:left}}
/* пока идёт заставка, шапки нет */
.ve-hd{transition:transform .32s var(--ve-ease-2),background .3s var(--ve-ease-2),color .3s var(--ve-ease-2),box-shadow .3s,opacity .5s var(--ve-ease)}
html.ve-intro .ve-hd{opacity:0;pointer-events:none;transition:none} /* прячется сразу, без затухания — иначе кнопка мигает над заставкой */
.ve-hd__mark svg{display:block}
.ve-hd__right{display:flex;align-items:center;gap:22px}
.ve-hd.is-solid{color:var(--ve-ink)}
.ve-hd.is-solid .ve-hd__in{background:linear-gradient(180deg,rgba(255,255,255,.64),rgba(255,255,255,.42));border:1px solid rgba(255,255,255,.8);-webkit-backdrop-filter:blur(var(--ve-dock-blur)) saturate(1.6) brightness(1.04);backdrop-filter:blur(var(--ve-dock-blur)) saturate(1.6) brightness(1.04);box-shadow:0 14px 40px rgba(21,52,32,.16),inset 0 1px 0 #fff,inset 0 -8px 20px rgba(255,255,255,.2)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.ve-hd.is-solid .ve-hd__in{background:rgba(255,255,255,.95)}}
/* тач: фиксированный док с размытием в WebKit (Safari, Telegram) мигает при прокрутке — плотная подложка без backdrop-filter */
html.ve-coarse .ve-hd.is-solid .ve-hd__in{background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.9));-webkit-backdrop-filter:none;backdrop-filter:none}
@media(prefers-reduced-transparency:reduce){.ve-hd.is-solid .ve-hd__in{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}}
/* после хиро шапка белая — кнопка становится тёмной (вместе с hover) */
.ve-hd.is-solid .ve-hd__cta,.ve-hd.is-solid .ve-hd__cta:hover{background:linear-gradient(180deg,rgba(31,77,46,.12),rgba(31,77,46,.06));color:var(--ve-ink);border-color:rgba(31,77,46,.24);text-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 6px 18px rgba(21,52,32,.12),inset 0 1px 0 #fff;--ve-bloom-on:0}
.ve-hd.is-hidden{transform:translateY(-110%)}
@media(prefers-reduced-motion:reduce){.ve-hd,.ve-hd__in{transition:none}}
/* телефон (владелец, 24.10: «лого по центру»): сетка 1fr auto 1fr — знак ровно по центру, кнопка справа; белый док после хиро — во всю ширину, знак остаётся в центре */
@media(max-width:899px){
  .ve-hd__in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  .ve-hd__mark{grid-column:2;justify-self:center}
  .ve-hd__right{grid-column:3;justify-self:end}
  .ve-hd.is-solid .ve-hd__in{width:calc(100% - 24px);padding:0 7px 0 6px}
  /* слева от знака — «Меню» (зеркально кнопке «Рассчитать»), тап-зона 44 px; панель с тремя разделами и телефоном выпадает под доком на его ширину */
  .ve-hd__in{position:relative}
  .ve-hd__burger{grid-column:1;justify-self:start;display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:0 10px;font-size:14.5px;letter-spacing:.01em;border-radius:999px}
  .ve-hd__burger i{position:relative;width:16px;height:9px;flex:none}
  .ve-hd__burger i::before,.ve-hd__burger i::after{content:"";position:absolute;left:0;right:0;height:1.5px;border-radius:1px;background:currentColor;transition:transform .3s var(--ve-ease)}
  .ve-hd__burger i::before{top:0}.ve-hd__burger i::after{bottom:0}
  .ve-hd.is-menu .ve-hd__burger i::before{transform:translateY(3.75px) rotate(45deg)}
  .ve-hd.is-menu .ve-hd__burger i::after{transform:translateY(-3.75px) rotate(-45deg)}
  .ve-hd__nav{position:absolute;left:0;right:0;top:calc(100% + 8px);display:flex;flex-direction:column;padding:8px;border-radius:26px;color:var(--ve-ink);
    background:#fff;border:1px solid rgba(255,255,255,.9);box-shadow:0 18px 48px rgba(21,52,32,.2),inset 0 1px 0 #fff;
    opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-8px)}
  .ve-hd.is-menu .ve-hd__nav{opacity:1;visibility:visible;pointer-events:auto;transform:none}
  .ve-hd__nav a{display:block;padding:15px 16px;border-radius:18px;font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
  .ve-hd__nav a:active,.ve-hd__nav a[aria-current]{background:rgba(31,77,46,.08)}
}
/* планшеты и телефон в альбоме (матрица 11.11): панель не во всю ширину дока, а компактная под кнопкой «Меню» */
@media(min-width:600px) and (max-width:899px){.ve-hd__nav{right:auto;width:340px}}
@media(prefers-reduced-motion:reduce){.ve-hd__nav,.ve-hd__burger,.ve-hd__burger i::before,.ve-hd__burger i::after{transition:none}}
</style>
<script>
(function(){
  var hd=document.getElementById('ve-hd');if(!hd)return;
  var y0=window.scrollY||0,solidAt=function(){return Math.max(240,(window.innerHeight||600)*.9)};
  var bg=hd.querySelector('[data-ve-menu]'),nav=hd.querySelector('.ve-hd__nav');
  function menu(on){hd.classList.toggle('is-menu',on);bg.setAttribute('aria-expanded',on?'true':'false')}
  // смена вида: гасим текущую шапку (is-swap), меняем состояние, проявляем новую; при загрузке и без анимаций — сразу
  var solid=false,swapT=0,live=false;
  function setSolid(on){
    if(on===solid)return;solid=on;clearTimeout(swapT);
    if(!live||(window.VE&&VE.rm)){hd.classList.toggle('is-solid',on);hd.classList.remove('is-swap');return}
    hd.classList.add('is-swap');
    swapT=setTimeout(function(){hd.classList.toggle('is-solid',on);void hd.offsetWidth;hd.classList.remove('is-swap')},170);
  }
  function tick(){
    var y=window.scrollY||0,d=y-y0;
    if((d>6||d<-6)&&hd.classList.contains('is-menu'))menu(false); // страница поехала — панель закрывается, шапка прячется как обычно
    // над хиро шапка прозрачная и не прячется: в ней знак, в который садится логотип первого экрана
    var hero=document.getElementById('ve-hero'),inHero=hero&&hero.getBoundingClientRect().bottom>(hero.querySelector('.ve-hero__hold')?(window.innerHeight||600):60); // 13.11: у хиро в конце задержка, поверх сцены поднимаются тарифы — док включается, когда сцена отлипла, а не когда секция ушла целиком
    // страница без хиро (шапка на /policy, /consent): белая прозрачная шапка на белой бумаге не видна — сразу белый док; решаем после разбора страницы (на главной блок хиро идёт после шапки)
    var noHero=!hero&&document.readyState!=='loading';
    setSolid(noHero||(!inHero&&y>solidAt()));
    // шапка с меню не прячется при прокрутке вниз (владелец 11.11: «вниз скроллю — его нету» — меню должно быть всегда)
    y0=y;
  }
  window.addEventListener('scroll',function(){live=true;tick()},{passive:true});tick();if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',tick);
  hd.querySelector('[data-ve-go-form]').addEventListener('click',function(){menu(false);if(window.VE)VE.goForm()});
  bg.addEventListener('click',function(){menu(!hd.classList.contains('is-menu'))});
  nav.addEventListener('click',function(e){if(e.target.closest('a'))menu(false)});
  document.addEventListener('click',function(e){if(hd.classList.contains('is-menu')&&!hd.contains(e.target))menu(false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&hd.classList.contains('is-menu')){menu(false);bg.focus()}});
})();
</script>
