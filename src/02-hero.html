<section class="ve ve-hero" id="ve-hero" data-ch="0">
  <div class="ve-hero__stage">
    <picture class="ve-hero__poster">
      <source media="(orientation: portrait)" srcset="__BASE__media/scene/poster-tall.webp?v=__V__">
      <img src="__BASE__media/scene/poster-wide.webp?v=__V__" alt="" decoding="async" fetchpriority="high" width="960" height="540">
    </picture>
    <canvas class="ve-hero__canvas" aria-hidden="true"></canvas>
    <video class="ve-hero__loop" muted loop playsinline preload="none" aria-hidden="true"></video>
    <canvas class="ve-hero__dust" aria-hidden="true"></canvas>
    <div class="ve-hero__shade" aria-hidden="true"></div>

    <div class="ve-hero__text">
      <h1 class="ve-h1 ve-hero__h1 ve-hero__ch" data-at="1"><span class="ve-w">Сад,</span> <span class="ve-w">за</span> <span class="ve-w">которым</span> <span class="ve-w">не&nbsp;нужно</span> <span class="ve-w">следить</span></h1>
      <p class="ve-hero__sub ve-hero__ch" data-at="2"><span class="ve-w">Один договор.</span> <span class="ve-w">Один ответственный.</span><br><span class="ve-w">Весь сад под&nbsp;контролем.</span></p>
      <p class="ve-hero__cta ve-hero__ch" data-at="2"><button class="ve-btn ve-btn--light ve-w" type="button" data-ve-go-form>Рассчитать стоимость</button></p>
      <nav class="ve-hero__index" aria-label="Разделы сайта"></nav>
    </div>
    <div class="ve-hero__hint" aria-hidden="true"><span></span></div>
    <!-- заставка: белый экран, логотип наполняется, пока грузятся кадры; потом улетает в знак шапки -->
    <div class="ve-hero__intro" aria-hidden="true"><div class="ve-hero__load"><i></i></div></div>
    <div class="ve-hero__logo" aria-hidden="true" data-spectral data-spectral-heavy>
      <div class="ve-logo__halo"></div>
      <svg viewBox="__VB_FULL__" fill="currentColor">
        <defs>
          <linearGradient id="ve-hig-gloss" gradientUnits="userSpaceOnUse" x1="0" y1="230" x2="0" y2="760"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#fff" stop-opacity=".18"/><stop offset=".62" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <linearGradient id="ve-hig-shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <mask id="ve-him-shine" maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="1254"><g transform="rotate(-22 627 627)"><rect class="ve-logo__band" x="-300" y="-400" width="260" height="2000" fill="url(#ve-hig-shine)"/></g></mask>
          <mask id="ve-him-ring" maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="1254"><path class="ve-hero__wedge" fill="#fff" d="M0 0Z"/></mask>
          <linearGradient id="ve-hig-br" gradientUnits="userSpaceOnUse" x1="0" y1="800" x2="0" y2="210"><stop class="ve-hero__s1" offset="0" stop-color="#fff"/><stop class="ve-hero__s2" offset="0" stop-color="#000"/></linearGradient>
          <mask id="ve-him-br" maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="1254"><rect width="1254" height="1254" fill="url(#ve-hig-br)"/></mask>
        </defs>
        <g class="ve-hero__lm"><use href="#ve-l-ring" mask="url(#ve-him-ring)"/><use href="#ve-l-branch" mask="url(#ve-him-br)"/><use class="ve-hero__lp" href="#ve-l-letters" style="--d:900ms"/>
          <g class="ve-logo__gloss" fill="url(#ve-hig-gloss)"><use href="#ve-l-ring" mask="url(#ve-him-ring)"/><use href="#ve-l-letters"/></g>
          <g class="ve-logo__shine" fill="#fff" mask="url(#ve-him-shine)"><use href="#ve-l-ring" mask="url(#ve-him-ring)"/><use href="#ve-l-branch"/><use href="#ve-l-letters"/></g></g>
        <g class="ve-hero__lt"><use class="ve-hero__lp" href="#ve-l-word" style="--d:1150ms"/><use class="ve-hero__lp" href="#ve-l-rules" style="--d:1350ms"/><use class="ve-hero__lp" href="#ve-l-leaf" style="--d:1450ms"/><use class="ve-hero__lp" href="#ve-l-tag2" style="--d:1550ms"/></g>
      </svg>
    </div>
  </div>
</section>
<style>
/* пролёт ~ 3 экрана на клип + превращение и стоп-кадр с меню */
.ve-hero{position:relative;height:560vh;height:560svh;background:#2B3A2E;color:var(--ve-paper);margin:0}
.ve-hero__stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#2B3A2E}
.ve-hero__poster,.ve-hero__canvas,.ve-hero__loop,.ve-hero__shade,.ve-hero__intro,.ve-hero__dust{position:absolute;inset:0}
/* пух одуванчиков днём и светлячки ночью — лёгкий холст поверх кадра, живёт только пока хиро на экране */
.ve-hero__dust{width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity 1.2s var(--ve-ease)}
.ve-hero.is-fly .ve-hero__dust{opacity:1}
@media(prefers-reduced-motion:reduce){.ve-hero__dust{display:none}}
.ve-hero__poster img{width:100%;height:100%;object-fit:cover}
.ve-hero__canvas{display:block;width:100%;height:100%;opacity:0;transition:opacity .6s var(--ve-ease)}
/* телефон: камера дышит CSS-масштабом (холст, постер и луп вместе, чтобы стык не прыгал); компьютер дышит кадрами в scene.js */
html.ve-coarse .ve-hero.is-docked :is(.ve-hero__canvas,.ve-hero__loop,.ve-hero__poster){animation:ve-hero-breathe 9s ease-in-out infinite alternate}
@keyframes ve-hero-breathe{from{scale:1}to{scale:1.03}}
/* телефон: пролёт короче — меньше свайпов, кадры идут быстрее */
html.ve-coarse .ve-hero{height:440vh;height:440svh}
html.ve-no-breathe .ve-hero__canvas,html.ve-no-breathe .ve-hero__loop,html.ve-no-breathe .ve-hero__poster{animation:none!important}
@media(prefers-reduced-motion:reduce){.ve-hero__canvas,.ve-hero__loop,.ve-hero__poster{animation:none!important}}
html.ve-no-dust .ve-hero__dust{display:none}
.ve-hero.is-live .ve-hero__canvas{opacity:1}
/* ночной луп: живёт поверх финального кадра, появляется, когда свет включён */
.ve-hero__loop{width:100%;height:100%;object-fit:cover;object-position:50% 50%;opacity:0;transition:opacity .9s var(--ve-ease);pointer-events:none}
.ve-hero.is-loop .ve-hero__loop{opacity:1}
/* тень только снизу и только когда есть текст — пролёт чистый */
.ve-hero__shade{background:linear-gradient(to top,rgba(17,38,24,.62) 0%,rgba(17,38,24,.28) 34%,rgba(17,38,24,0) 62%);opacity:0;transition:opacity .8s var(--ve-ease)}
.ve-hero:not([data-ch="0"]) .ve-hero__shade{opacity:1}
.ve-hero__text{position:absolute;left:0;right:0;bottom:0;padding:0 var(--ve-pad) calc(30px + env(safe-area-inset-bottom));max-width:1240px;margin:0 auto}
@media(min-width:900px){.ve-hero__text{padding:0 40px 64px}}
/* текст идёт по скроллу словами (владелец: «скроллишь — текст появляется подряд»): слова и строки получают opacity/transform из onP, без CSS-переходов */
.ve-hero__ch{pointer-events:none}
.ve-hero[data-ch="2"] .ve-hero__cta{pointer-events:auto}
.ve-w{display:inline-block;opacity:0;transform:translateY(.5em);will-change:opacity,transform}
.ve-hero__cta .ve-w{transform:translateY(12px)}
@media(prefers-reduced-motion:reduce){.ve-w{opacity:1!important;transform:none!important}.ve-hero__ch{opacity:0;transition:opacity .4s}.ve-hero[data-ch="1"] [data-at="1"],.ve-hero[data-ch="2"] [data-at="1"],.ve-hero[data-ch="2"] [data-at="2"]{opacity:1;pointer-events:auto}}
.ve-hero__h1{color:inherit}
@media(min-width:900px){.ve-hero__h1{max-width:14ch}}
.ve-hero__sub{margin-top:16px;min-height:2.6em;font-weight:500;font-size:17px;line-height:1.3}
@media(min-width:900px){.ve-hero__sub{font-size:21px;margin-top:20px}}
.ve-hero__cta{margin-top:20px}
.ve-hero__hint{position:absolute;right:calc(var(--ve-pad) + 2px);bottom:calc(30px + env(safe-area-inset-bottom));width:1px;height:36px;overflow:hidden;opacity:.5;transition:opacity .4s}
@media(min-width:900px){.ve-hero__hint{display:none}}
.ve-hero__hint span{display:block;width:1px;height:100%;background:currentColor;animation:ve-hint 2.4s var(--ve-ease) infinite}
@keyframes ve-hint{0%{transform:translateY(-100%)}60%,100%{transform:translateY(100%)}}
.ve-hero:not([data-ch="0"]) .ve-hero__hint,html.ve-intro .ve-hero__hint{opacity:0}

/* ---- заставка ---- */
.ve-hero__intro{background:var(--ve-paper);z-index:5;transition:opacity .9s var(--ve-ease)}
.ve-hero.is-fly .ve-hero__intro{opacity:0}
.ve-hero.is-docked .ve-hero__intro{visibility:hidden}
.ve-hero__logo{position:absolute;z-index:6;left:50%;top:50%;width:min(300px,70vw);margin:calc(min(300px,70vw) * -.41) 0 0 calc(min(300px,70vw) * -.5);transform-origin:0 0;will-change:transform;color:var(--ve-ink);transition:color .6s var(--ve-ease)}
@media(min-width:900px){.ve-hero__logo{width:380px;margin:-156px 0 0 -190px}}
.ve-hero__logo svg{display:block;width:100%;height:auto;overflow:visible}
.ve-hero.is-fly .ve-hero__logo{color:var(--ve-paper);filter:drop-shadow(0 2px 14px rgba(10,24,14,.4))}
.ve-hero.is-docked .ve-hero__logo{visibility:hidden}
.ve-hero__lp{opacity:0;transform:translateY(10px);transition:opacity .7s var(--ve-ease),transform .7s var(--ve-ease);transition-delay:var(--d,0ms)}
.ve-hero__logo.is-in .ve-hero__lp{opacity:1;transform:none}
.ve-hero.is-fly .ve-hero__lt{transition:opacity .35s}

/* указатель разделов в финале: шесть строк капсом с бронзовой точкой, лесенкой над ночным садом */
/* указатель разделов — второй ряд стеклянных кнопок под «Рассчитать стоимость» (владелец: «как рассчитать, только списочек снизу») */
.ve-hero__index{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;visibility:hidden;pointer-events:none}
.ve-hero.is-menu .ve-hero__index{visibility:visible;pointer-events:auto}
.ve-hero__index a{position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:600;letter-spacing:-.01em;color:#fff;white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.45);
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.3);box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -6px 12px rgba(255,255,255,.05);
  opacity:0;transform:translateY(10px);will-change:opacity,transform;transition:background .3s var(--ve-ease-2),transform .3s var(--ve-ease)}
.ve-hero__index a i{width:5px;height:5px;border-radius:50%;background:var(--ve-bronze);box-shadow:0 0 6px rgba(185,154,102,.8);flex:0 0 auto}
.ve-hero__index a::before{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;padding:var(--ve-ring-w);pointer-events:none;background:var(--ve-ring);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@media(hover:hover){.ve-hero__index a:hover{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.14));transform:translateY(-2px)!important}}
.ve-hero__index a:active{transform:scale(.97)!important}
.ve-hero__index a:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(min-width:900px){.ve-hero__index{margin-top:18px;gap:10px;max-width:640px}.ve-hero__index a{height:40px;padding:0 16px;font-size:14px}}
@media(prefers-reduced-motion:reduce){.ve-hero.is-menu .ve-hero__index a{opacity:1!important;transform:none!important}}
/* тач: без размытия, как и кнопка над фото */
html.ve-coarse .ve-hero__index a{background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.11))}
/* логотип в стекле: блик по верху, бегущий свет раз в 7 с, спектральное свечение по дуге */
.ve-logo__gloss{opacity:0;transition:opacity 1.2s var(--ve-ease)}
.ve-hero__logo.is-in .ve-logo__gloss{opacity:1}
.ve-hero.is-fly .ve-logo__gloss{opacity:0}
.ve-logo__band{animation:ve-shine 7s var(--ve-ease) infinite;animation-delay:2.4s}
@keyframes ve-shine{0%{transform:translateX(0)}28%{transform:translateX(1800px)}100%{transform:translateX(1800px)}}
.ve-logo__halo{position:absolute;inset:0;pointer-events:none;-webkit-mask:__ARC_MASK__ center/100% 100% no-repeat;mask:__ARC_MASK__ center/100% 100% no-repeat;background:conic-gradient(from var(--ve-a) at __ARC_CX__ __ARC_CY__,rgba(255,255,255,0) 0deg,hsla(110,20%,78%,.35) 12deg,hsla(80,25%,86%,.7) 24deg,hsla(60,30%,94%,.9) 31deg,#fff 38deg 46deg,hsla(44,65%,82%,.95) 53deg,hsla(36,50%,68%,.7) 63deg,hsla(28,40%,58%,.3) 76deg,rgba(255,255,255,0) 88deg,rgba(255,255,255,0) 168deg,hsla(110,18%,80%,.25) 182deg,hsla(80,22%,88%,.5) 194deg,rgba(255,255,255,.8) 202deg,hsla(42,55%,80%,.5) 212deg,hsla(30,40%,62%,.2) 224deg,rgba(255,255,255,0) 238deg);opacity:calc(.9*var(--ve-f));mix-blend-mode:screen;transition:opacity .8s var(--ve-ease)}
.ve-logo__halo::after{content:"";position:absolute;inset:0;background:inherit;filter:blur(10px) saturate(1.3);opacity:.7}
html.ve-coarse .ve-logo__halo::after{display:none}
html.ve-coarse .ve-logo__halo{mix-blend-mode:normal;opacity:calc(.55*var(--ve-f))} /* mix-blend на тач заставляет композитить всю сцену */
.ve-hero.is-docked .ve-logo__halo{display:none}
.ve-hero__logo:not(.is-in) .ve-logo__halo,.ve-hero.is-docked .ve-logo__halo{opacity:0}
/* линия загрузки серии под логотипом: растёт по кадрам */
.ve-hero__load{position:absolute;left:50%;top:calc(50% + min(300px,70vw) * .5);width:min(200px,46vw);margin-left:calc(min(200px,46vw) / -2);height:1px;background:rgba(31,77,46,.14)}
@media(min-width:900px){.ve-hero__load{top:calc(50% + 200px);width:220px;margin-left:-110px}}
.ve-hero__load i{position:absolute;left:0;top:0;height:1px;width:100%;background:var(--ve-bronze);transform:scaleX(var(--p,0));transform-origin:left;transition:transform .35s var(--ve-ease)}
@media(prefers-reduced-motion:reduce){.ve-hero__ch,.ve-hero__index a,.ve-hero__index,.ve-hero__lp,.ve-hero__intro,.ve-hero__loop{transition:none}.ve-hero__hint{display:none}.ve-hero__lp{opacity:1;transform:none}.ve-logo__band{animation:none}.ve-logo__halo::after{display:none}}
</style>
<script>
(function(){
  var root=document.getElementById('ve-hero');if(!root)return;
  var video=root.querySelector('.ve-hero__loop');
  // таймлайн общий для движка и текста: пролёт · покос · свет · меню
  var TL={flight:.66,groom:.8,light:.88,menu:.9};
  var VE_RM=false;try{VE_RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  var html=document.documentElement;html.classList.add('ve-has-hero','ve-intro');

  // ---- заставка: логотип рисуется, ждём первый кадр сцены, потом логотип улетает в знак шапки ----
  var logo=root.querySelector('.ve-hero__logo'),lm=root.querySelector('.ve-hero__lm'),lt=root.querySelector('.ve-hero__lt');
  var wedge=root.querySelector('.ve-hero__wedge'),s1=root.querySelector('.ve-hero__s1'),s2=root.querySelector('.ve-hero__s2');
  var CX=638.8,CY=506.2,R=420,A0=-96,A1=142;
  function ring(t){var a1=A0+(A1-A0)*t,n=Math.max(2,Math.ceil(t*60)),d='M'+CX+' '+CY;for(var k=0;k<=n;k++){var a=(A0+(a1-A0)*k/n)*Math.PI/180;d+='L'+(CX+R*Math.cos(a)).toFixed(1)+' '+(CY+R*Math.sin(a)).toFixed(1)}wedge.setAttribute('d',d+'Z')}
  function branch(t){var o=Math.min(1,t*1.08);s1.setAttribute('offset',Math.max(0,o-.08).toFixed(3));s2.setAttribute('offset',o.toFixed(3))}
  function drawn(){ring(1);branch(1);s2.setAttribute('offset','1.1');logo.classList.add('is-in')}
  ring(0);branch(0);
  var t0=performance.now(),introDone=false;
  if(VE_RM)drawn();
  else{logo.classList.add('is-in');(function f(now){var t=(now-t0)/1000,a=Math.min(1,t/1.3),b=Math.min(1,Math.max(0,(t-.45)/1.5));ring(1-Math.pow(1-a,3));branch(1-Math.pow(1-b,2));if(a<1||b<1)requestAnimationFrame(f);else drawn()})(t0)}
  function measure(){
    var hm=document.querySelector('.ve-hd__mark svg')||document.querySelector('.ve-hd__mark');if(!hm)return null;
    var keep=logo.style.transform;logo.style.transform='none';
    var c=logo.getBoundingClientRect(),m=lm.getBoundingClientRect(),h=hm.getBoundingClientRect();logo.style.transform=keep;
    if(!m.width||!h.width)return null;var sc=h.width/m.width;
    return {sc:sc,tx:h.left-c.left-(m.left-c.left)*sc,ty:h.top-c.top-(m.top-c.top)*sc};
  }
  function fly(){
    if(introDone)return;introDone=true;
    var g=measure();root.classList.add('is-fly');html.classList.remove('ve-intro');
    var end=function(){root.classList.add('is-docked');html.classList.add('ve-logo-docked')};
    if(VE_RM||!g){end();return}
    lt.style.opacity=0;
    VE.tween(0,1,1000,function(k){var e=1-Math.pow(1-k,3),s=1+(g.sc-1)*e;logo.style.transform='translate3d('+(g.tx*e).toFixed(1)+'px,'+(g.ty*e).toFixed(1)+'px,0) scale('+s.toFixed(4)+')';if(k>=1)end()});
  }
  // готово = логотип дорисован и серия пролёта загружена (линия под логотипом растёт по кадрам); потолок ожидания 15 с
  var loadBar=root.querySelector('.ve-hero__load i'),loaded=0;
  function onLoad(n,total){loaded=total?n/total:1;loadBar.style.setProperty('--p',loaded.toFixed(3))}
  var coarseGate=false;try{coarseGate=window.matchMedia('(hover:none) and (pointer:coarse)').matches}catch(e){}
  var NEED=coarseGate?.5:.92; // телефон: отпускаем на 50 % (опорные кадры уже есть) — остальное догружается, пока камера дышит на первом кадре
  var gate=setInterval(function(){var t=performance.now()-t0;if((root.classList.contains('is-live')&&loaded>=NEED&&t>2200)||t>15000){clearInterval(gate);loadBar.style.setProperty('--p','1');fly()}},100);

  // ---- главы текста и луп по прогрессу ----
  var lastCh=-1,menu=false,loopSrc=null,loopOn=false;
  // слова подряд по скроллу: заголовок .76→.86, подпись .85→.9, кнопка .89→.92, указатель .9→.98; назад — уходят
  var W1=[].slice.call(root.querySelectorAll('.ve-hero__h1 .ve-w')),W2=[].slice.call(root.querySelectorAll('.ve-hero__sub .ve-w')),W3=[].slice.call(root.querySelectorAll('.ve-hero__cta .ve-w'));
  var seqLast={};
  function seq(els,p,p0,p1,id,dx){
    /* вне своего диапазона и без изменений — ни одной записи в стиль: раньше 10 слов переписывались на каждом шаге скролла */
    var n=els.length,per=(p1-p0)/(n+1.4);
    if(p<p0-.01&&seqLast[id]==='lo')return;if(p>p1+.02&&seqLast[id]==='hi')return;seqLast[id]=p<p0-.01?'lo':p>p1+.02?'hi':'mid';
    for(var i=0;i<n;i++){var k=(p-p0-i*per)/(per*2.4);k=k<0?0:k>1?1:k;k=Math.round((1-Math.pow(1-k,3))*100)/100;
      if(els[i].__k===k)continue;els[i].__k=k;
      var st=els[i].style;st.opacity=k;st.transform=k===1?'none':dx?'translateX('+(dx*(1-k)).toFixed(1)+'px)':'translateY('+((1-k)*.5).toFixed(2)+'em)'}
  }
  var IDX=null;
  function onP(p){
    var ch=p<TL.groom?0:p<TL.light?1:2;
    if(ch!==lastCh){lastCh=ch;root.setAttribute('data-ch',ch)}
    if(!VE_RM){seq(W1,p,.76,.86,'h1');seq(W2,p,.85,.9,'sub');seq(W3,p,.89,.92,'cta');if(IDX)seq(IDX,p,.91,.98,'idx')}
    var on=p>=TL.menu;if(on!==menu){menu=on;root.classList.toggle('is-menu',on);if(on)spin()}
    html.classList.toggle('ve-hero-done',p>=TL.light); // кнопка шапки появляется только после пролёта
    root.classList.toggle('is-idle',p<.002);
    var lo=!!loopSrc&&p>=TL.light+.01;
    if(lo!==loopOn){loopOn=lo;root.classList.toggle('is-loop',lo);if(lo){if(!video.getAttribute('src')){video.src=loopSrc;video.load()}var pr=video.play();if(pr&&pr.catch)pr.catch(function(){})}else video.pause()}
  }
  root.querySelector('[data-ve-go-form]').addEventListener('click',function(){if(window.VE)VE.goForm()});

  // ---- указатель разделов ----
  var SEC=[['Постоянный уход','ve-tariffs'],['Разовые работы','ve-pricelist'],['Сад под ключ','ve-ways'],['Почему выгодно','ve-economics'],['Спецусловия','ve-bonuses']];
  var index=root.querySelector('.ve-hero__index');
  index.innerHTML=SEC.map(function(o,i){return '<a href="#'+o[1]+'" data-to="'+o[1]+'" style="--i:'+i+'"><i></i><span>'+o[0]+'</span></a>'}).join('');
  IDX=[].slice.call(index.querySelectorAll('a'));

  function spin(){}
  // тап по строке: плавно едем в раздел, точка садится в его подпись
  var going=null;
  index.addEventListener('click',function(e){
    var a=e.target.closest('a');if(!a)return;var sec=document.getElementById(a.getAttribute('data-to'));if(!sec)return;
    e.preventDefault();go(sec);
  });
  function dotOf(sec){
    var cap=sec.querySelector('.ve-caps')||sec.querySelector('h2');if(!cap)return null;
    var d=cap.querySelector('.ve-dot');if(!d){d=document.createElement('i');d.className='ve-dot';d.setAttribute('aria-hidden','true');cap.insertBefore(d,cap.firstChild)}
    return d;
  }
  function go(sec){
    if(going)going();
    var dot=dotOf(sec),y0=window.scrollY,target=function(){return Math.max(0,sec.getBoundingClientRect().top+window.scrollY-(window.innerWidth>=900?24:8))};
    if(VE_RM){window.scrollTo(0,target());if(dot)dot.classList.add('is-on');return}
    var dur=Math.min(1400,Math.max(700,Math.abs(target()-y0)/8)),st=performance.now(),dead=false;
    var stop=function(){dead=true;window.removeEventListener('wheel',stop);window.removeEventListener('touchstart',stop);going=null};
    window.addEventListener('wheel',stop,{passive:true});window.addEventListener('touchstart',stop,{passive:true});going=stop;
    (function step(now){if(dead)return;var t=Math.min(1,(now-st)/dur),k=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;window.scrollTo(0,y0+(target()-y0)*k);
      if(t<1)requestAnimationFrame(step);else{stop();if(dot)dot.classList.add('is-on');var h=sec.querySelector('h2');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}}})(st);
  }

  // ---- пух и светлячки: 30 частиц (18 на телефоне), дрейф вверх-вправо с качанием; ночью — тёплые ----
  (function(){
    var cv=root.querySelector('.ve-hero__dust');if(!cv||VE_RM)return;var ctx=cv.getContext('2d');
    var coarse=false;try{coarse=window.matchMedia('(hover:none) and (pointer:coarse)').matches}catch(e){}
    if(html.classList.contains('ve-no-dust'))return;
    var N=coarse?8:30,P=[],W=0,H=0,dpr=1,on=false,raf=0,last=0,acc=0,sprite=null,scrolling=0;
    /* во время прокрутки пух стоит (холст не перерисовывается) — вся мощность кадру пролёта; продолжает через 300 мс тишины */
    window.addEventListener('scroll',function(){scrolling=performance.now()},{passive:true});
    function mk(i){return{x:Math.random(),y:Math.random(),r:.8+Math.random()*1.6,v:.012+Math.random()*.02,s:.6+Math.random()*.8,ph:Math.random()*6.28,a:.25+Math.random()*.5}}
    for(var i=0;i<N;i++)P.push(mk(i));
    var spriteN=null;
    function mkSprite(c){var sp=document.createElement('canvas');sp.width=sp.height=32;var g=sp.getContext('2d'),gr=g.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,'rgba('+c+',1)');gr.addColorStop(.3,'rgba('+c+',.6)');gr.addColorStop(1,'rgba('+c+',0)');g.fillStyle=gr;g.fillRect(0,0,32,32);return sp}
    function size(){var r=cv.getBoundingClientRect();dpr=coarse?1:Math.min(window.devicePixelRatio||1,2);W=Math.round(r.width);H=Math.round(r.height);cv.width=W*dpr;cv.height=H*dpr;
      sprite=mkSprite('255,252,240');spriteN=mkSprite('255,206,112')} // днём — белый пух, ночью — тёплые светлячки (без ctx.filter: Safari)
    function frame(now){raf=0;if(!on)return;if(now-scrolling<300){last=now;raf=requestAnimationFrame(frame);return}var dt=last?Math.min(.05,(now-last)/1000):0;last=now;
      if(coarse){acc+=dt;if(acc<.05){raf=requestAnimationFrame(frame);return}dt=acc;acc=0}
      if(!W)size();ctx.clearRect(0,0,cv.width,cv.height);
      var night=lastCh===2,t=now/1000;
      ctx.globalCompositeOperation='lighter';
      for(var i=0;i<P.length;i++){var q=P[i];q.y-=q.v*dt*q.s;q.x+=(.004*q.s+Math.sin(t*.7+q.ph)*.003)*dt*60/60;q.x+=Math.sin(t*.9+q.ph)*.0006;
        if(q.y<-.05||q.x>1.05){q.y=1.05;q.x=Math.random()*.9-.1}
        var tw=.5+.5*Math.sin(t*1.6+q.ph*2),al=q.a*(night?.55+.45*tw:.7+.3*tw),rr=q.r*(night?1.5:1.25)*dpr*(coarse?1.6:2.2);
        ctx.globalAlpha=al;ctx.drawImage(night?spriteN:sprite,q.x*W*dpr-rr*2,q.y*H*dpr-rr*2,rr*4,rr*4)}
      ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
      raf=requestAnimationFrame(frame)}
    function play(){if(on||document.hidden)return;on=true;last=0;if(!raf)raf=requestAnimationFrame(frame)}
    function stop(){on=false}
    if('IntersectionObserver' in window)new IntersectionObserver(function(en){en[0].isIntersecting?play():stop()},{threshold:.05}).observe(root.querySelector('.ve-hero__stage'));else play();
    document.addEventListener('visibilitychange',function(){document.hidden?stop():play()});
    window.addEventListener('resize',function(){W=0});
  })();
  function start(){
    var VE=window.VE;if(!VE)return setTimeout(start,50);
    import(VE.url('js/scene.js')).then(function(m){VE.hero=m.mount(root,{base:VE.base,v:VE.v,onProgress:onP,onManifest:function(man){if(html.classList.contains('ve-no-loops'))return;var tall=window.innerHeight>window.innerWidth,f=tall&&man.loopTall?man.loopTall:man.loop;if(f)loopSrc=VE.url('media/scene/'+f)},onLoad:onLoad,reducedMotion:VE.rm,timeline:TL})}).catch(function(e){console.warn('[VE] сцена недоступна:',e&&e.message);root.classList.add('is-static','is-live')});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
