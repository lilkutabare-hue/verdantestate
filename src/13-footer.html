<footer class="ve ve-ft" id="ve-footer">
  <div class="ve-wrap">
    <div class="ve-ft__logo" aria-label="Verdant Estate — Landscaping &amp; Garden Design">
      <div class="ve-ft__mark">__MARK_SPLIT__</div>
      <p class="ve-ft__name">Verdant Estate</p>
      <p class="ve-ft__rule"><i></i><svg viewBox="0 0 24 16" aria-hidden="true"><path d="M2 14C6 4 14 2 22 2c-1 8-6 12-14 12-2 0-4-.2-6 0z" fill="currentColor"/></svg><i></i></p>
      <p class="ve-ft__tag">Landscaping &amp; Garden Design</p>
    </div>
    <div class="ve-ft__cols">
      <p class="ve-ft__geo">Москва и Московская область</p>
      <div class="ve-ft__links">
        <a class="ve-num" href="tel:+70000000000" data-ve-tel>+7 000 000-00-00</a>
        <a href="https://t.me/" target="_blank" rel="noopener" data-ve-tg>Telegram</a>
        <a href="https://wa.me/" target="_blank" rel="noopener" data-ve-wa>WhatsApp</a>
        <a href="mailto:hello@example.com" data-ve-mail>hello@example.com</a>
      </div>
      <p class="ve-ft__legal"><a href="#" data-ve-policy>Политика конфиденциальности</a><span>© <span class="ve-num" data-ve-year>2026</span> Verdant Estate</span></p>
    </div>
  </div>
</footer>
<style>
.ve-ft{padding:var(--ve-gap) 0 calc(40px + env(safe-area-inset-bottom));border-top:1px solid var(--ve-line);background:var(--ve-paper)}
.ve-ft__logo{display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--ve-ink)}
.ve-ft__mark{width:150px;height:138px}
.ve-ft__mark svg{width:100%;height:100%;display:block;overflow:visible}
.ve-ft__mark path{opacity:0;transition:opacity .5s var(--ve-ease)}
.ve-ft__mark.is-done path{opacity:1}
.ve-ft__name{margin-top:22px;font-weight:600;letter-spacing:-.015em;font-weight:600;font-size:24px;letter-spacing:.14em;text-transform:uppercase;line-height:1}
.ve-ft__rule{display:flex;align-items:center;gap:10px;margin-top:12px;width:220px;color:var(--ve-moss)}
.ve-ft__rule i{flex:1;height:1px;background:var(--ve-line)}
.ve-ft__rule svg{width:16px;height:11px}
.ve-ft__tag{margin-top:10px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ve-moss)}
.ve-ft__cols{margin-top:48px;display:grid;gap:20px;text-align:center;font-size:15px}
.ve-ft__geo{color:var(--ve-moss)}
.ve-ft__links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px}
.ve-ft__links a{color:var(--ve-ink);border-bottom:1px solid transparent;transition:border-color .25s}
@media(hover:hover){.ve-ft__links a:hover{border-color:var(--ve-line)}}
.ve-ft__legal{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;font-size:13px;color:var(--ve-moss)}
.ve-ft__legal a{color:inherit}
@media(min-width:900px){
  .ve-ft__mark{width:170px;height:156px}
  .ve-ft__name{font-size:28px}
  .ve-ft__cols{margin-top:64px;grid-template-columns:1fr auto 1fr;align-items:center;text-align:left}
  .ve-ft__legal{justify-content:flex-end}
}
@media(prefers-reduced-motion:reduce){.ve-ft__mark path{opacity:1;transition:none}}
</style>
<script>
(function(){
  var root=document.getElementById('ve-footer');if(!root||!window.VE)return;
  var y=root.querySelector('[data-ve-year]');if(y)y.textContent=new Date().getFullYear();
  var mark=root.querySelector('.ve-ft__mark'),svg=mark.querySelector('svg'),paths=mark.querySelectorAll('path');if(!svg||!paths.length)return;
  // классификация под-путей трассировки: самый большой — дуга со стеблем, крупные справа — буквы, остальное — листья
  var info=[];for(var i=0;i<paths.length;i++){var b=paths[i].getBBox();info.push({el:paths[i],x:b.x,y:b.y,w:b.width,h:b.height,a:b.width*b.height,cx:b.x+b.width/2,cy:b.y+b.height/2})}
  var vb=svg.viewBox.baseVal,W=vb.width,H=vb.height;
  info.sort(function(a,b){return b.a-a.a});
  var arc=info[0],letters=[],leaves=[];
  for(var j=1;j<info.length;j++){var o=info[j];if(o.w>W*.18&&o.cx>W*.35)letters.push(o);else leaves.push(o)}
  leaves.sort(function(a,b){return b.cy-a.cy}); // снизу вверх — как растёт
  var NS='http://www.w3.org/2000/svg',mid=svg.getAttribute('id')||'ve-ftm';
  var mask=document.createElementNS(NS,'mask');mask.setAttribute('id',mid+'-m');mask.setAttribute('maskUnits','userSpaceOnUse');mask.setAttribute('x',-W);mask.setAttribute('y',-H);mask.setAttribute('width',W*3);mask.setAttribute('height',H*3);
  var wedge=document.createElementNS(NS,'path');wedge.setAttribute('fill','#fff');mask.appendChild(wedge);
  var defs=document.createElementNS(NS,'defs');defs.appendChild(mask);svg.insertBefore(defs,svg.firstChild);
  arc.el.setAttribute('mask','url(#'+mid+'-m)');
  var cx=W*.5,cy=H*.5,R=Math.max(W,H),a0=Math.PI*.62; // старт внизу слева, по часовой
  function setWedge(t){var n=Math.max(2,Math.ceil(t*48)),d='M'+cx+' '+cy;for(var k=0;k<=n;k++){var a=a0+(k/n)*t*Math.PI*2;d+=' L'+(cx+R*Math.cos(a))+' '+(cy+R*Math.sin(a))}wedge.setAttribute('d',d+' Z')}
  setWedge(0);
  function play(){
    if(VE.rm){mark.classList.add('is-done');setWedge(1);return}
    var t0=performance.now(),D=1400;arc.el.style.opacity=1;
    leaves.forEach(function(l,i){setTimeout(function(){l.el.style.opacity=1},300+i*90)});
    letters.forEach(function(l){setTimeout(function(){l.el.style.opacity=1},900)});
    (function f(now){var t=Math.min(1,(now-t0)/D);var e=1-Math.pow(1-t,3);setWedge(e);if(t<1)requestAnimationFrame(f);else{arc.el.removeAttribute('mask');mark.classList.add('is-done')}})(t0);
  }
  if('IntersectionObserver' in window){var io=new IntersectionObserver(function(en){if(en[0].isIntersecting){io.disconnect();play()}},{threshold:.4});io.observe(mark)}else play();
})();
</script>
