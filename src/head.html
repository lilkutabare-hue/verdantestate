<!-- VE · head · общий код HEAD сайта Verdant Estate · сборка __V__ -->
<link rel="preconnect" href="https://lilkutabare-hue.github.io" crossorigin>
<style>
:root{
  --ve-paper:#FFFFFF;--ve-paper-2:#F1F5F0;--ve-ink:#1F4D2E;--ve-acc:#2E7D46;--ve-moss:#5F7A62;--ve-line:rgba(31,77,46,.14);--ve-bronze:#B08D57;--ve-lamp:#B08D57;
  --ve-sans:-apple-system,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,system-ui,sans-serif;
  --ve-ease:cubic-bezier(.2,.9,.2,1);--ve-ease-2:cubic-bezier(.2,.8,.2,1);
  --ve-r:8px;--ve-gap:72px;--ve-pad:20px;
  color-scheme:light only;
}
@media(min-width:900px){:root{--ve-r:12px;--ve-gap:120px;--ve-pad:40px}}

/* база блока: всё наше живёт под .ve, стили Тильды .t-* не трогаем */
.ve{font-family:var(--ve-sans);font-size:16px;line-height:1.5;color:var(--ve-ink);background:var(--ve-paper);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%;box-sizing:border-box}
.ve *,.ve *::before,.ve *::after{box-sizing:inherit}
@media(min-width:900px){.ve{font-size:17px}}
:where(.ve) p{margin:0}
:where(.ve) a{color:inherit;text-decoration:none}
:where(.ve) img{display:block;max-width:100%;height:auto}
:where(.ve) button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:where(.ve) :focus{outline:none}
:where(.ve) :focus-visible{outline:2px solid var(--ve-moss);outline-offset:3px;border-radius:4px}

.ve-wrap{max-width:1240px;margin:0 auto;padding-left:var(--ve-pad);padding-right:var(--ve-pad)}
.ve-sec{padding-top:var(--ve-gap);padding-bottom:0}
.ve-sec--last{padding-bottom:var(--ve-gap)}
.ve-copy{max-width:56ch}
.ve-muted{color:var(--ve-moss)}

/* типографика: один гротеск, заголовки плотные, без курсива и росчерков */
.ve-h1,.ve-h2,.ve-h3{font-family:var(--ve-sans);font-weight:600;margin:0;letter-spacing:-.022em;text-wrap:balance}
.ve-h1{font-size:40px;line-height:1.02}
.ve-h2{font-size:30px;line-height:1.08;letter-spacing:-.02em}
.ve-h3{font-size:20px;line-height:1.2;letter-spacing:-.012em}
@media(min-width:900px){.ve-h1{font-size:64px;line-height:1}.ve-h2{font-size:42px;line-height:1.04}.ve-h3{font-size:22px}}
.ve-caps{font-family:var(--ve-sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ve-moss)}
.ve-price,.ve-num{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1}
.ve-lead{font-size:18px;line-height:1.45;max-width:56ch;font-weight:500;letter-spacing:-.01em}
@media(min-width:900px){.ve-lead{font-size:22px}}
.ve-sub{margin-top:14px;max-width:56ch;color:var(--ve-moss)}
.ve-big{font-weight:600;letter-spacing:-.02em;font-size:26px;line-height:1.1}
@media(min-width:900px){.ve-big{font-size:30px}}

.ve .ve-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 26px;border-radius:999px;
  background:var(--ve-acc);color:var(--ve-paper);font-size:16px;font-weight:500;letter-spacing:-.005em;white-space:nowrap;border:1px solid var(--ve-acc);
  transition:transform .3s var(--ve-ease-2),background .3s var(--ve-ease-2),color .3s var(--ve-ease-2),border-color .3s var(--ve-ease-2)}
.ve .ve-btn--ghost{background:transparent;color:var(--ve-ink);border-color:rgba(31,77,46,.35)}
.ve .ve-btn--light{background:var(--ve-paper);color:var(--ve-ink);border-color:var(--ve-paper)}
.ve .ve-btn--sm{height:44px;padding:0 20px;font-size:15px}
@media(hover:hover){.ve .ve-btn:hover{transform:translateY(-2px)}.ve .ve-btn--ghost:hover{background:var(--ve-acc);color:var(--ve-paper);border-color:var(--ve-acc)}}
.ve .ve-btn:active{transform:scale(.97)}
@media(min-width:900px){.ve .ve-btn{height:54px;padding:0 30px}}

/* ---- система движения ----
   .ve-r      появление: прозрачность + подъём 12px, один раз, по IntersectionObserver
   .ve-rg     группа: дети появляются лесенкой по 60 мс (--d на каждом)
   .ve-img    картинка открывается снизу вверх и «садится» из лёгкого увеличения
   .ve-line   верхний хэйрлайн рисуется слева направо
   .ve-pill   бегущая подложка активной вкладки (VE.pills)
   VE.swap    смена текста через короткое затухание                                   */
.ve-r,.ve-rg>*{opacity:0;transform:translateY(12px);transition:opacity .55s var(--ve-ease),transform .55s var(--ve-ease);transition-delay:var(--d,0ms)}
.ve-r.is-in,.ve-rg.is-in>*{opacity:1;transform:none}
.ve-img{position:relative;overflow:hidden;border-radius:var(--ve-r);background:var(--ve-paper-2);clip-path:inset(0 0 100% 0 round var(--ve-r));transition:clip-path .9s var(--ve-ease);transition-delay:var(--d,0ms)}
.ve-img>img{width:100%;height:100%;object-fit:cover;transform:scale(1.06);transition:transform 1.3s var(--ve-ease);transition-delay:var(--d,0ms)}
.ve-img.is-in{clip-path:inset(0 round var(--ve-r))}
.ve-img.is-in>img{transform:scale(1)}
.ve-line{position:relative}
.ve-line::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--ve-line);transform:scaleX(0);transform-origin:left;transition:transform .9s var(--ve-ease);transition-delay:var(--d,0ms)}
.ve-line.is-in::before{transform:scaleX(1)}
.ve-tabs{position:relative;display:inline-flex;gap:4px;padding:3px;border-radius:999px;background:var(--ve-paper-2)}
.ve-tabs>button{position:relative;z-index:1;height:36px;padding:0 15px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ve-moss);transition:color .3s var(--ve-ease-2)}
.ve-tabs>button.is-on{color:var(--ve-paper)}
.ve-pill{position:absolute;top:3px;left:0;height:36px;width:0;border-radius:999px;background:var(--ve-acc);transition:transform .4s var(--ve-ease),width .4s var(--ve-ease);transform:translateX(0)}
.ve-swap{display:inline-block;transition:opacity .18s var(--ve-ease-2),transform .18s var(--ve-ease-2)}
.ve-swap.is-out{opacity:0;transform:translateY(5px)}
.ve-hair{border:0;border-top:1px solid var(--ve-line);margin:0}
/* точка, в которую садится сфера меню хиро (ставит хиро у подписи раздела) */
.ve-caps{position:relative}
.ve-dot{position:absolute;left:-16px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--ve-acc);transform:scale(0);transition:transform .4s var(--ve-ease)}
.ve-dot.is-on{transform:scale(1)}
.ve-tar .ve-dot{background:var(--ve-paper)}
.ve h2[tabindex="-1"]:focus{outline:none}

/* горизонтальные ленты со snap */
.ve-strip{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding-left:var(--ve-pad);padding-right:var(--ve-pad);scroll-padding-left:var(--ve-pad);margin:0 calc(-1 * var(--ve-pad))}
.ve-strip::-webkit-scrollbar{display:none}
.ve-strip>*{scroll-snap-align:start;flex:0 0 auto}

@media(prefers-reduced-motion:reduce){
  .ve-r,.ve-rg>*,.ve-img,.ve-img>img,.ve-line::before{opacity:1;transform:none;clip-path:none;transition:none}
  .ve .ve-btn,.ve-pill,.ve-swap{transition:none}
}
</style>
<script>
/* реестр VE: адреса с версией, появление, вкладки, смена текста, общий префилл формы */
(function(){
  if(window.VE&&window.VE.v)return;
  var base=window.VE_BASE||'__BASE__';
  var VE={v:'__V__',base:base,
    url:function(p){return base+p+(p.indexOf('?')<0?'?v=':'&v=')+VE.v},
    fmt:function(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')},
    _h:{},on:function(e,f){(VE._h[e]=VE._h[e]||[]).push(f)},emit:function(e,d){(VE._h[e]||[]).forEach(function(f){f(d)})},
    state:{},
    set:function(k,v){VE.state[k]=v;try{sessionStorage.setItem('ve-calc',JSON.stringify(VE.state))}catch(e){}VE.emit('state',VE.state)},
    goForm:function(patch){if(patch)for(var k in patch)VE.set(k,patch[k]);var f=document.getElementById('ve-form');if(f){f.scrollIntoView({behavior:VE.rm?'auto':'smooth',block:'start'});VE.emit('form:focus')}},
    rm:false,
    reveal:function(root){
      root=root||document;
      var els=root.querySelectorAll('.ve-r:not(.is-in),.ve-rg:not(.is-in),.ve-img:not(.is-in),.ve-line:not(.is-in)');
      if(!('IntersectionObserver' in window)||VE.rm){for(var i=0;i<els.length;i++)els[i].classList.add('is-in');return}
      VE._io=VE._io||new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){var el=x.target;
        if(el.classList.contains('ve-rg')){var ch=el.children;for(var j=0;j<ch.length;j++){ch[j].style.setProperty('--d',Math.min(j,12)*60+'ms');var sub=ch[j].querySelectorAll('.ve-img,.ve-line');for(var k=0;k<sub.length;k++)sub[k].style.setProperty('--d',Math.min(j,12)*60+'ms')}}
        el.classList.add('is-in');VE._io.unobserve(el)}})},{threshold:.12,rootMargin:'0px 0px -6% 0px'});
      for(var i=0;i<els.length;i++)VE._io.observe(els[i]);
    },
    /* бегущая подложка вкладок: контейнер .ve-tabs, кнопки внутри с .is-on */
    pills:function(tabs){
      var pill=tabs.querySelector('.ve-pill');if(!pill){pill=document.createElement('i');pill.className='ve-pill';tabs.insertBefore(pill,tabs.firstChild)}
      var move=function(){var on=tabs.querySelector('button.is-on');if(!on)return;pill.style.width=on.offsetWidth+'px';pill.style.transform='translateX('+on.offsetLeft+'px)'};
      move();if('ResizeObserver' in window)new ResizeObserver(move).observe(tabs);window.addEventListener('resize',move);
      return move;
    },
    /* смена текста с коротким затуханием */
    swap:function(el,html){if(el.innerHTML===html)return;if(VE.rm){el.innerHTML=html;return}el.classList.add('ve-swap');el.classList.add('is-out');setTimeout(function(){el.innerHTML=html;el.classList.remove('is-out')},180)}
  };
  try{VE.rm=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  try{var s=sessionStorage.getItem('ve-calc');if(s)VE.state=JSON.parse(s)||{}}catch(e){}
  window.VE=VE;
  var boot=function(){VE.reveal();document.documentElement.classList.add('ve-ready')};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
  document.addEventListener('keydown',function(e){if(e.key==='Tab')document.documentElement.classList.add('ve-kb')});
})();
</script>
