<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>рендер стиллов · Verdant Estate</title>
<style>body{margin:0;background:#222;color:#ddd;font:13px/1.5 system-ui}#log{white-space:pre;padding:12px}canvas{display:block;max-width:100%}</style></head>
<body><div id="log">старт…</div><canvas id="c"></canvas>
<script type="module">
// Рендер стиллов секций из 3D-сада: каждый кадр → PNG → POST /__save → tools/.cache/stills/. Дальше tools/stills.mjs делает webp.
// Открывать на стенде: http://localhost:5181/tools/stills.html?only=tariff-basic (необязательно)
import { GardenScene } from '/site/js/garden3d.js';
const log = (m) => { document.getElementById('log').textContent += '\n' + m; };
const only = new URLSearchParams(location.search).get('only');
const W4 = [1000, 1250], W16 = [1440, 900];
const SPECS = {
  'tariff-basic':   { size: W4, variant: 'basic', p: 0.68, cam: [0.3, 1.5, 0.4], look: [0.8, 0.7, -10] },
  'tariff-premium': { size: W4, variant: 'master', p: 0.68, cam: [0.3, 1.62, 0.4], look: [1.1, 0.75, -14] },
  'tariff-estate':  { size: W4, variant: 'estate', p: 0.68, cam: [0, 2.4, 0.4], look: [0, 0.6, -30] },
  'price-lawn':     { size: W4, variant: 'master', p: 0.68, cam: [-2, 0.7, -2], look: [-1.5, 0.2, -16] },
  'price-plants':   { size: W4, variant: 'master', p: 0.68, cam: [3.2, 1.3, -5.5], look: [7.5, 0.5, -10.5] },
  'price-trees':    { size: W4, variant: 'master', p: 0.66, cam: [-6, 1.6, -22], look: [-4, 6, -40] },
  'way-01': { size: W4, variant: 'master', p: 0.68, cam: [-3, 1.0, -1.5], look: [-1.5, 0.3, -16] },
  'way-02': { size: W4, variant: 'master', p: 0.68, cam: [2.2, 1.3, -2.5], look: [-2, 0.3, -20] },
  'way-03': { size: W4, variant: 'master', p: 0.68, cam: [2.8, 1.2, -6], look: [7.5, 0.4, -10.5] },
  'way-04': { size: W4, variant: 'master', p: 1.0, cam: [0.3, 1.62, 0.4], look: [1.1, 0.75, -14] },
  'way-05': { size: W4, variant: 'basic', p: 0.68, cam: [-4, 1.4, -8], look: [2, 1.2, -17] },
  'way-06': { size: W4, variant: 'master', extras: ['rocks'], p: 0.68, cam: [-1, 1.3, -4], look: [-4, 0.3, -10] },
  'way-07': { size: W4, variant: 'master', extras: ['sprinklers'], p: 0.7, cam: [-4, 1.2, -3], look: [-2, 0.3, -12] },
  'way-08': { size: W4, variant: 'master', extras: ['deck'], p: 0.68, cam: [2.5, 1.5, -3.5], look: [-2.5, 0.9, -8] },
  'way-09': { size: W4, variant: 'master', season: 'autumn', p: 0.62, cam: [0.3, 1.62, 0.4], look: [1.1, 0.75, -14] },
  'way-10': { size: W4, variant: 'master', extras: ['rocks', 'deck'], p: 0.7, cam: [1.5, 1.9, 1.0], look: [-1, 0.6, -14] },
  'ba-before': { size: W16, variant: 'master', overgrown: true, p: 0.42, cam: [0.3, 1.62, 0.4], look: [1.1, 0.75, -14] },
  'ba-after':  { size: W16, variant: 'master', p: 0.42, cam: [0.3, 1.62, 0.4], look: [1.1, 0.75, -14] },
  'season-spring': { size: W16, variant: 'master', season: 'spring', p: 0.42, cam: [0.3, 1.62, 0.4], look: [1.1, 0.75, -14] },
  'season-summer': { size: W16, variant: 'master', season: 'summer', p: 0.42, cam: [0.3, 1.62, 0.4], look: [1.1, 0.75, -14] },
  'season-autumn': { size: W16, variant: 'master', season: 'autumn', p: 0.42, cam: [0.3, 1.62, 0.4], look: [1.1, 0.75, -14] },
  'season-winter': { size: W16, variant: 'master', season: 'winter', p: 0.42, cam: [0.3, 1.62, 0.4], look: [1.1, 0.75, -14] },
  // кадры сцены для пути A (fallback без WebGL) и постер
  'scene-wide-00': { size: [1440, 810], variant: 'master', p: 0.0 }, 'scene-wide-01': { size: [1440, 810], variant: 'master', p: 0.42 }, 'scene-wide-02': { size: [1440, 810], variant: 'master', p: 0.7 }, 'scene-wide-03': { size: [1440, 810], variant: 'master', p: 1.0 },
  'scene-tall-00': { size: [720, 1280], variant: 'master', p: 0.0 }, 'scene-tall-01': { size: [720, 1280], variant: 'master', p: 0.42 }, 'scene-tall-02': { size: [720, 1280], variant: 'master', p: 0.7 }, 'scene-tall-03': { size: [720, 1280], variant: 'master', p: 1.0 },
};
const names = Object.keys(SPECS).filter((n) => !only || n === only || n.startsWith(only));
const canvas = document.getElementById('c');
let cache = null;
for (const name of names) {
  const sp = SPECS[name];
  const key = JSON.stringify([sp.variant, sp.extras || []]);
  if (!cache || cache.key !== key) { if (cache) cache.scene.dispose(); const c2 = document.createElement('canvas'); canvas.replaceWith(c2); c2.id = 'c'; cache = { key, scene: new GardenScene(c2, { variant: sp.variant, extras: sp.extras, stills: true, quality: { mobile: false, dpr: 1, bloom: true, env: true, grass: 40000, texSize: 512, shadow: 4096 } }), canvas: c2 }; }
  const G = cache.scene, c = cache.canvas;
  G.setSeason(sp.season || 'summer'); G.setOvergrown(!!sp.overgrown);
  if (sp.cam) { G.camera.position.set(...sp.cam); G.look.set(...sp.look); } else { G.camera.position.set(0.3, 1.62, 0.4); G.look.set(1.1, 0.75, -14); }
  G.lastEnv = undefined; G.resize(sp.size[0], sp.size[1], 1); G.setTime(sp.p);
  for (let i = 0; i < 3; i++) { G.render(1.0 + i * 0.1); await new Promise((r) => setTimeout(r, 40)); }
  const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
  const res = await fetch('/__save?name=' + name, { method: 'POST', body: blob });
  log(`${name}: ${sp.size.join('×')} → ${await res.text()}`);
}
log('ГОТОВО ' + names.length);
document.title = 'done';
</script></body></html>
